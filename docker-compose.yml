name: supplylink

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylida belgilanishi kerak}
      POSTGRES_DB: ${DB_DATABASE:-supplylink}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Baza faqat ichki tarmoqqa ochiq. Tashqaridan ulanish kerak bo'lsa:
    # ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-supplylink}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    ports:
      - "8000:8000"
    volumes:
      # Yuklangan mahsulot rasmlari konteyner qayta yaratilganda yo'qolmasligi uchun
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # app.main va app.api bir xil ilovani beradi (ikkalasi ham to'liq sozlangan)
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

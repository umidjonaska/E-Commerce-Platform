server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Yuklangan fayllar ham, API ham bir xil origin'dan beriladi:
    # shuning uchun brauzerda CORS umuman kerak bo'lmaydi.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Hashli fayl nomlari - uzoq kesh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: har qanday yo'l index.html ga tushadi (React Router o'zi hal qiladi)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
